# Scene Definition: Curiosity 01 - "Por que o céu é azul?"
# Exemplo de cena de curiosidade científica com estilo low-poly

scene:
  name: "curiosity_01"
  title: "Por que o céu é azul?"
  duration: 12  # segundos
  tags: ["ciencia", "fisica", "luz"]

environment:
  type: "gradient_sphere"  # Esfera interna com gradiente simulando céu
  colors:
    top: [0.2, 0.5, 0.9]     # Azul claro
    bottom: [0.9, 0.85, 0.7]  # Laranja suave (horizonte)
  ground:
    enabled: true
    color: [0.3, 0.6, 0.3]   # Verde low-poly
    size: 20

characters:
  - name: "Narrator_Bot"
    type: "simple_bot"
    position: [0, 0, 0]
    scale: 1.0
    animation: "idle_bounce"
    color: [0.9, 0.9, 0.95]

props:
  - name: "Sun_Light_Source"
    type: "emissive_sphere"
    position: [5, 5, 8]
    scale: 0.8
    color: [1.0, 0.95, 0.6]
    emissive_strength: 5.0

  - name: "Light_Rays"
    type: "cone_transparent"
    position: [0, 0, 6]
    rotation: [0, 0, 0]
    scale: [0.5, 0.5, 4]
    color: [1.0, 1.0, 0.9]
    opacity: 0.15

camera:
  start_position: [0, -7, 3]
  end_position: [3, -5, 2.5]
  target: [0, 0, 1]
  motion: "smooth_orbit"
  fov_animation: false

text_overlays:
  - frame_start: 10
    frame_end: 90
    text: "A luz solar contém todas as cores"
    position: "bottom"
  - frame_start: 100
    frame_end: 200
    text: "O azul se espalha mais na atmosfera"
    position: "bottom"
  - frame_start: 210
    frame_end: 340
    text: "Por isso vemos o céu azul!"
    position: "center"